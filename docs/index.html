<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web page title</title>

    <!-- The following line references an external css file -->
    <link href="css/navbar.css" rel="stylesheet">
    <link href="css/practice.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>
  <script type="module" src="js/practice.js"></script>
  <div class="app">

    <nav class="navbar">
      <span class="nav-brand">NBA Shot Charts</span>
      <div class="nav-links">
        <a href="index.html" class="nav-link active">Shot Chart</a>
        <a href="html/attempts2.html" class="nav-link">Attempts</a>
      </div>
    </nav>

    <div class="dashboard">

      <div class="panel tooltip">
        <div class="shot-tooltip" id="shot-tooltip">
          <div class="tooltip-header">
            <img id="tooltip-player-photo" />
            <div>
              <div class="tooltip-player" id="tooltip-player"></div>
              <div class="tooltip-region" id="tooltip-region"></div>
            </div>
          </div>

          <div class="tooltip-stats">
            <div><span>FGM / FGA: </span><strong id="tooltip-fgm"></strong></div>
            <div><span>FG%: </span><strong id="tooltip-fg"></strong></div>
            <div><span>League Avg: </span><strong id="tooltip-league"></strong></div>
            <div><span>Pos Group Avg: </span><strong id="tooltip-position"></strong></div>
          </div>
        </div>
      </div>
      <div class="panel shot-chart">
        <svg id="shot-chart-svg"></svg>
      </div>
      <div class="panel line-3">
        <svg class = "stacked-bar", id="ShotDist"></svg>
      </div>
      <div class="panel filters">
        <label class="filter-label">Player</label>
        <div class="autocomplete">
            <input
            id="player-input"
            class="filter-select"
            type="text"
            placeholder="Search player..."
            autocomplete="off"
            />
            <div id="player-results" class="autocomplete-results"></div>
        </div>

        <label class="filter-label">Quarter</label>
        <select class="filter-select" id="quarter-select"></select>

        <label class="filter-label">Team</label>
        <select class="filter-select" id="team-select"></select>

        <label class="filter-label">Opp. Team</label>
        <select class="filter-select" id="defending_team-select"></select>

        <label class="filter-label">Season</label>
        <select class="filter-select" id="season-select"></select>
        <button class="filter-button" id="filter-button" type="button">
        Apply Filters
        </button>
        <button class="clear-button" id="clear-button" type="button">
        Clear Filters
        </button>
      </div>
      <div class="panel line-2">
        <svg class = "line-chart", id="AvgLine"></svg>
      </div>
      <div class="panel about">Built by <a class = "website-link" href = https://ksuelflo.github.io> Kyle Suelflow</a>
        <br>Data last updated February 10th, 2026
        <br>Code repository: <a href="https://github.com/ksuelflo/NBA-Interactive-Viz"><i id="github-icon" class="fa-brands fa-github"></i></a>
      </div>
      <div class="panel shot-chart-legend"></div>
      <div class="panel line-chart-legend"></div>

    </div>
  </div>
</body>


</html>
